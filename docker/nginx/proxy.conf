# repasse ao gateway. O Host original SEGUE (o gateway resolve o tenant por ele); cabeçalhos de proxy que o cliente mandou são SOBRESCRITOS, nunca confiados.
proxy_pass http://gateway;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;      # NÃO acrescenta ao do cliente: quem fala direto com o nginx não forja o IP que o gateway usa no limite
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Tenant-Id "";                    # esse cabeçalho nunca vale (o tenant vem do token/host); zerar evita confiança acidental a jusante
proxy_connect_timeout 3s; proxy_send_timeout 15s; proxy_read_timeout 30s;
proxy_buffering on; proxy_hide_header X-Powered-By;
