# nginx do Polaris: termina TLS e repassa ao gateway. NÃO é a fronteira de segurança da aplicação (o gateway valida token, tenant e contrato); é a fronteira de REDE:
# TLS moderno, HTTP→HTTPS, cabeçalhos, tamanho/tempo de corpo, limite por IP e o que NUNCA sai para a internet (/metrics, /pronto, /saude).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/json;
  server_tokens off;                      # não anuncia a versão
  access_log /dev/stdout combined;        # um linha por requisição; o gateway registra o que importa (sem corpo, sem token)
  sendfile on; tcp_nopush on; keepalive_timeout 30s;

  # corpo pequeno e prazos curtos: uma API JSON, não um servidor de arquivos (slowloris e uploads gigantes morrem aqui)
  client_max_body_size 1m; client_body_timeout 10s; client_header_timeout 10s; send_timeout 15s; large_client_header_buffers 4 8k;
  # tokens e cookies nunca em log de acesso: o formato `combined` não os registra; o `Authorization` não é variável de log aqui

  # limite por IP na borda; o gateway ainda limita por tenant/usuário. `$binary_remote_addr` (4 B) cabe 16 mil IPs em 1 MB.
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=cadastro:10m rate=2r/s;
  limit_req_status 429; limit_conn_zone $binary_remote_addr zone=conn:10m; limit_conn_status 429;

  # TLS: só 1.2/1.3, suítes modernas, sem tickets reutilizáveis entre reinícios
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off; ssl_session_cache shared:SSL:10m; ssl_session_timeout 1d; ssl_session_tickets off;
  ssl_stapling on; ssl_stapling_verify on; resolver 1.1.1.1 9.9.9.9 valid=300s; resolver_timeout 5s;

  # quem fala com o gateway (rede interna do compose); keepalive para não abrir conexão a cada pedido
  upstream gateway { server gateway:3000; keepalive 32; }

  # HTTP: só o desafio ACME (renovação de certificado) e o redirecionamento
  server {
    listen 8080 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
  }

  # HTTPS: o gateway. O mesmo bloco serve `*.${POLARIS_DOMINIO}` e os domínios próprios dos tenants (o gateway decide pelo Host; host sem dono é 400 lá).
  server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;   # as respostas são JSON; a CSP das PÁGINAS é do gateway/engine

    limit_conn conn 40;

    # operação e métricas NUNCA saem para a internet (o Prometheus entra pela rede interna, direto no gateway)
    location ~ ^/(metrics|pronto|saude)$ { return 404; }

    # o cadastro público é o ponto mais caro e mais abusável: limite próprio, bem menor
    location /publico/cadastro { limit_req zone=cadastro burst=5 nodelay; include /etc/nginx/proxy.conf; }

    location / { limit_req zone=api burst=60 nodelay; include /etc/nginx/proxy.conf; }
  }
}
