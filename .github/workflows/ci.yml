name: CI

on:
  pull_request:
  push:
    branches: [main]

# mínimo necessário: o CI só lê o repositório
permissions:
  contents: read

# um run novo do mesmo PR cancela o anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  segredos:
    name: Segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o histórico inteiro: segredo que já vazou continua vazado depois de apagado
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Nenhum segredo em texto puro nos arquivos versionados
        run: bash scripts/check-no-secrets.sh --all
      - name: Nenhum segredo em texto puro em NENHUM commit do histórico
        run: bash scripts/check-no-secrets.sh --historico

  commits:
    name: Mensagens de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: PL-<id> tipo(escopo) e sem trailer de IA
        env:
          BASE: ${{ github.base_ref }}
        run: node tools/ferramentas/bin/check-commits.ts "origin/${BASE}..HEAD"

  qualidade:
    name: Tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Poppler (a paridade HTML × PDF rasteriza o PDF; o Chrome já vem na imagem)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Instalar (lockfile congelado, sem scripts de pós-instalação)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: O próprio workflow é seguro
        run: pnpm valida-ci
      - name: Tipos (TypeScript estrito, todos os pacotes)
        run: pnpm tipos
      - name: Testes (Postgres real em memória, sem credenciais)
        run: pnpm test

  postgres-real:
    name: Postgres real (concorrência, locks, timeouts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      POLARIS_PG_REAL_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar (lockfile congelado, sem scripts de pós-instalação)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Testes contra Postgres de verdade (mesmos testes, sem PGlite)
        run: pnpm --filter @polaris/pgreal test

  auditoria:
    name: Dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Vulnerabilidades graves em dependências de produção
        run: pnpm audit --prod --audit-level=high
